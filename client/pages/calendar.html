<!-- =====================================
     CALENDAR PAGE
===================================== -->

<div class="calendar-page">



    <!-- =================================
         CALENDAR HEADER
    ================================== -->

    <div class="calendar-header">


        <div>

            <h1>
                Work Calendar
            </h1>

            <p>
                Manage your daily work schedule
            </p>

        </div>



        <!-- ADD WORK -->

        <button
            type="button"
            onclick="openEventBox()">

            <i
                class="fa-solid fa-plus">
            </i>

            Add Work

        </button>


    </div>



    <!-- =================================
         CALENDAR CARD
    ================================== -->

    <div class="calendar-card">



        <!-- MONTH TITLE -->

        <div class="month-title">


            <!-- PREVIOUS -->

            <button
                type="button"
                onclick="previousMonth()">

                <i
                    class="fa-solid fa-chevron-left">
                </i>

            </button>



            <!-- MONTH -->

            <h2 id="monthYear">
                August 2026
            </h2>



            <!-- NEXT -->

            <button
                type="button"
                onclick="nextMonth()">

                <i
                    class="fa-solid fa-chevron-right">
                </i>

            </button>


        </div>



        <!-- =================================
             WEEK DAYS
        ================================== -->

        <div class="weekdays">


            <div>
                Sun
            </div>


            <div>
                Mon
            </div>


            <div>
                Tue
            </div>


            <div>
                Wed
            </div>


            <div>
                Thu
            </div>


            <div>
                Fri
            </div>


            <div>
                Sat
            </div>


        </div>



        <!-- =================================
             CALENDAR GRID
        ================================== -->

        <div
            id="calendarGrid"
            class="calendar-grid">

        </div>


    </div>



</div>



<!-- =====================================
     ADD / EDIT WORK MODAL
===================================== -->

<div
    id="eventModal"
    class="modal">


    <div class="modal-box">


        <!-- MODAL TITLE -->

        <h2 id="modalTitle">
            Add Daily Work
        </h2>



        <!-- DATE -->

        <input
            type="date"
            id="eventDate">



        <!-- WORK DETAILS -->

        <input
            type="text"
            id="eventTitle"
            placeholder="Work Details">



        <!-- SAVE / UPDATE -->

        <button
            type="button"
            id="saveEventBtn"
            onclick="saveEvent()">

            <i
                class="fa-solid fa-floppy-disk">
            </i>

            Save Work

        </button>



        <!-- CANCEL -->

        <button
            type="button"
            onclick="closeEventBox()">

            <i
                class="fa-solid fa-xmark">
            </i>

            Cancel

        </button>


    </div>


</div>
