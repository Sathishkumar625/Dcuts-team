<div class="calendar-page">

    <div class="calendar-header">

        <h1>Work Calendar</h1>

        <button onclick="openEventBox()">
            <i class="fa-solid fa-plus"></i>
            Add Work
        </button>

    </div>

    <div class="calendar-card">

        <div class="month-title">
            <h2 id="monthYear"></h2>
        </div>

        <div class="weekdays">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

    </div>

</div>

<div id="eventModal" class="modal">

    <div class="modal-box">

        <h2>Add Daily Work</h2>

        <input
            type="date"
            id="eventDate">

        <input
            type="text"
            id="eventTitle"
            placeholder="Work Details">

        <button onclick="saveEvent()">
            Save
        </button>

        <button onclick="closeEventBox()">
            Cancel
        </button>

    </div>

</div>
