<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timesheet | THE D CUTS</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/timesheet.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<script src="../js/auth.js"></script>

<div id="navbar-container"></div>

<div class="timesheet-page">

<h1>Daily Timesheet</h1>

<p class="subtitle">

Manage Daily Project Work

</p>

<div class="timesheet-card">

<label>Employee</label>

<select id="employeeName">

<option value="">Select Employee</option>

<option value="Sathish Kumar">Sathish Kumar</option>

<option value="Naveen">Naveen</option>

</select>

<label>Date</label>

<input
type="date"
id="date">

<!-- Dynamic Project Container -->

<div id="projectContainer">

</div>

<div class="btn-group">

<button
class="add-btn"
onclick="addProjectCard()">

<i class="fa-solid fa-plus"></i>

Add Project

</button>

<button
class="save-btn"
onclick="saveTimesheet()">

<i class="fa-solid fa-floppy-disk"></i>

Save

</button>

<button
class="update-btn"
id="updateBtn"
onclick="updateTimesheet()">

<i class="fa-solid fa-pen"></i>

Update

</button>

</div>

</div>

<div class="table-card">

<h2>Timesheet Records</h2>

<table>

<thead>

<tr>

<th>Employee</th>

<th>Date</th>

<th>Project</th>

<th>Total</th>

<th>Completed</th>

<th>Balance</th>

<th>Action</th>

</tr>

</thead>

<tbody id="timesheetTable">

</tbody>

</table>

</div>

</div>

<script src="../js/navbar.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/timesheet.js"></script>

</body>

</html>
