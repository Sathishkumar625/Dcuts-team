<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    THE D CUTS | Login
</title>

<link
    rel="stylesheet"
    href="./css/login.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="login-container">

<div class="login-card">


<div class="logo">

<i class="fa-solid fa-camera"></i>

<h2>
THE D CUTS
</h2>

</div>


<h1>
Login
</h1>


<input
    type="email"
    id="email"
    placeholder="Email Address">


<input
    type="password"
    id="password"
    placeholder="Password">


<button
    type="button"
    id="loginButton">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

<button
type="button"
class="google-btn"
onclick="googleLogin()">

<i class="fa-brands fa-google"></i>

Continue with Google

</button>


<p id="message"></p>


</div>

</div>


<script
    src="./js/login.js">
</script>


<script
    type="module"
    src="./js/google-login.js">
</script>


</body>

</html>
